---
- name: Assert supported VM platform
  ansible.builtin.assert:
    that:
      - ansible_distribution == "Ubuntu"
      - ansible_distribution_version is version("24.04", "==")
      - ansible_architecture == "aarch64"
    fail_msg: "Требуется Ubuntu Server 24.04 arm64 (Apple Silicon VM)"

- name: Install base packages and remote module dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - openssh-server
      - ufw
      - python3-debian
      - python3-requests
      - qemu-user-static
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker official repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: [stable]
    architectures: [arm64]
    signed_by: https://download.docker.com/linux/ubuntu/gpg
    state: present

- name: Install Docker Engine
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: Enable Docker service
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Check qemu-x86_64 binfmt flags
  ansible.builtin.command: cat /proc/sys/fs/binfmt_misc/qemu-x86_64
  register: binfmt_x86
  changed_when: false
  failed_when: false

- name: Register amd64 binfmt for GHCR linux/amd64 images
  community.docker.docker_container:
    name: register-binfmt-amd64
    image: tonistiigi/binfmt
    command: --install amd64
    privileged: true
    auto_remove: true
    detach: false
    cleanup: true
  when: >
    binfmt_x86.rc != 0 or
    (binfmt_x86.stdout_lines | select('match', '^flags:.*F') | list | length) == 0
